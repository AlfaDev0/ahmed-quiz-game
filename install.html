<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6C63FF">
<title>تحميل لعبة تحدي الذكاء</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:linear-gradient(160deg,#0F0E17,#1A1932 60%,#2a2150);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:430px;width:100%;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:32px 26px;backdrop-filter:blur(6px)}
.ico{font-size:70px}
h1{font-size:26px;font-weight:900;margin:10px 0 6px;background:linear-gradient(135deg,#6C63FF,#FF6B6B);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p.sub{color:#A7A9BE;font-size:14px;margin-bottom:22px}
.big-btn{display:block;text-decoration:none;background:linear-gradient(135deg,#6C63FF,#5A52D5);color:#fff;font-weight:900;font-size:18px;padding:16px;border-radius:16px;margin-bottom:12px;box-shadow:0 8px 25px rgba(108,99,255,.45);transition:.2s}
.big-btn:hover{transform:translateY(-2px)}
.sec-btn{display:block;text-decoration:none;background:#232246;border:1px solid #3a3a6b;color:#fff;font-weight:700;font-size:14px;padding:13px;border-radius:14px;margin-bottom:20px}
.count{font-size:13px;color:#FFD700;margin-top:4px}
.qr{background:#fff;border-radius:16px;padding:10px;display:inline-block;margin:6px 0 16px}
.qr img{width:200px;height:200px;display:block;border-radius:8px}
</style>
</head>
<body>
<div class="box">
  <div class="ico">🧠</div>
  <h1>تحدي الذكاء</h1>
  <p class="sub">جارٍ فتح اللعبة وتثبيتها على جهازك...</p>
  <a class="big-btn" href="index.html" id="goBtn">📲 فتح وتثبيت اللعبة</a>
  <a class="sec-btn" href="game-files.zip" download>📦 ملفات اللعبة (ZIP)</a>
  <div class="qr"><img src="icons/qr.png" alt="QR"></div>
  <p class="count">سيتم فتح اللعبة تلقائياً خلال ١ ثانية...</p>
</div>
<script>
setTimeout(function(){location.href='index.html'},1000);
</script>
</body>
</html>
